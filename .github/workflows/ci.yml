name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  platform-doctor:
    name: Platform Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Install Platform Doctor
        run: go install github.com/chaosslabs/platform-doctor/cmd/platform-doctor@e8db1a5be9a72fc6aa9fcb5f5e0ae047f49325e1

      - name: Scan repository
        run: platform-doctor scan . --output "$RUNNER_TEMP/platform-doctor-report.md"

      - name: Add report to job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/platform-doctor-report.md" ]; then
            cat "$RUNNER_TEMP/platform-doctor-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Platform Doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-doctor-report
          path: ${{ runner.temp }}/platform-doctor-report.md
          retention-days: 30

  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install development tools
        run: make install

      - name: Run all checks
        run: make ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          fail_ci_if_error: true
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: platformlabs-co/fetchr.sh
